<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TP Recorder · 交互原型</title>
  <style>
    :root {
      --paper: #f5f2eb;
      --surface: #fcfbf7;
      --ink: #28302d;
      --muted: #69716c;
      --rule: #d9d5ca;
      --brand: #be6a36;
      --brand-soft: #f1ddcf;
      --connected: #397a5b;
      --connected-soft: #dcece3;
      --waiting: #b88427;
      --waiting-soft: #f3e7c7;
      --error: #b6534d;
      --error-soft: #f4dcd9;
      --shadow: 0 18px 50px rgba(40, 48, 45, .09);
      --radius-panel: 18px;
      --radius-control: 12px;
      --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      --sans: "IBM Plex Sans", "Noto Sans CJK SC", "PingFang SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(190, 106, 54, .08), transparent 28rem),
        var(--paper);
      font-family: var(--sans);
      line-height: 1.5;
    }

    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }

    .prototype-banner {
      padding: 10px 20px;
      color: var(--surface);
      background: var(--ink);
      font-size: 12px;
      letter-spacing: .04em;
      text-align: center;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 64px;
    }

    .intro { max-width: 760px; margin-bottom: 26px; }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--brand);
      font: 600 12px/1 var(--mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 10px; font-size: clamp(28px, 5vw, 44px); line-height: 1.08; letter-spacing: -.04em; }
    .intro p { margin-bottom: 0; color: var(--muted); font-size: 16px; max-width: 68ch; }

    .workbench {
      display: grid;
      grid-template-columns: minmax(300px, 390px) minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .phone-column, .panel {
      border: 1px solid var(--rule);
      border-radius: var(--radius-panel);
      background: rgba(252, 251, 247, .82);
      box-shadow: var(--shadow);
    }

    .phone-column { padding: 16px; }
    .phone {
      position: relative;
      overflow: hidden;
      min-height: 650px;
      border: 9px solid #1f2422;
      border-radius: 34px;
      background: var(--surface);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.16), 0 12px 28px rgba(40,48,45,.17);
    }
    .phone::before {
      content: "";
      position: absolute;
      top: 7px;
      left: 50%;
      z-index: 2;
      width: 74px;
      height: 6px;
      border-radius: 999px;
      background: #1f2422;
      transform: translateX(-50%);
    }

    .app-screen { min-height: 650px; padding: 30px 18px 20px; }
    .appbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
    .brand-lockup { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: -.02em; }
    .logo-mark { display: inline-grid; place-items: center; width: 31px; height: 31px; border-radius: 9px; color: #fff; background: var(--brand); font-weight: 800; }
    .appbar-menu { color: var(--muted); font-size: 22px; line-height: 1; }

    .route-panel, .capture-panel, .summary-panel, .session-card, .settings-card {
      border: 1px solid var(--rule);
      background: rgba(255,255,255,.38);
    }
    .route-panel { padding: 14px; border-radius: var(--radius-control); }
    .route-panel[data-tone="connected"] { border-color: rgba(57,122,91,.46); background: var(--connected-soft); }
    .route-panel[data-tone="waiting"] { border-color: rgba(184,132,39,.55); background: var(--waiting-soft); }
    .route-panel[data-tone="error"] { border-color: rgba(182,83,77,.55); background: var(--error-soft); }
    .route-kicker { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .route-main { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
    .status-dot { width: 12px; height: 12px; flex: 0 0 auto; border-radius: 50%; background: var(--muted); }
    .status-dot.connected { background: var(--connected); }
    .status-dot.waiting { background: var(--waiting); }
    .status-dot.error { background: var(--error); }
    .route-main strong { display: block; font-size: 17px; }
    .route-main span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }

    .capture-panel { margin-top: 14px; padding: 18px 14px 14px; border-radius: var(--radius-panel); text-align: center; }
    .segment-label { min-height: 18px; color: var(--muted); font: 11px/1.4 var(--mono); }
    .timer { margin: 22px 0 4px; font: 600 clamp(34px, 8vw, 52px)/1 var(--mono); letter-spacing: -.08em; font-variant-numeric: tabular-nums; }
    .state-label { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
    .state-label strong { color: var(--brand); }
    .waveform { display: flex; align-items: center; justify-content: center; gap: 3px; height: 84px; margin: 20px 0 12px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
    .waveform i { width: 3px; min-height: 5px; border-radius: 5px; background: var(--ink); opacity: .82; }
    .waveform i:nth-child(3n) { height: 45px; }
    .waveform i:nth-child(4n) { height: 24px; }
    .waveform i:nth-child(5n) { height: 58px; }
    .waveform i:nth-child(6n) { height: 16px; }
    .waveform i:nth-child(7n) { height: 35px; }
    .waveform.is-active i { background: var(--brand); }
    .waveform.is-muted i { height: 4px !important; background: var(--rule); }
    .meter-head { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
    .meter-head strong { color: var(--ink); font-family: var(--mono); font-weight: 500; }
    .meter { display: flex; gap: 3px; height: 10px; margin-top: 7px; }
    .meter i { flex: 1; border-radius: 3px; background: var(--rule); }
    .meter i.on { background: var(--connected); }
    .meter i.warn { background: var(--waiting); }
    .meter i.danger { background: var(--error); }

    .primary-action, .secondary-action, .small-action {
      width: 100%;
      min-height: 48px;
      border: 1px solid transparent;
      border-radius: var(--radius-control);
      cursor: pointer;
      transition: transform 120ms ease, background-color 180ms ease, border-color 180ms ease;
    }
    .primary-action:active, .secondary-action:active, .small-action:active { transform: translateY(1px); }
    .primary-action { margin-top: 16px; color: #fff; background: var(--brand); font-weight: 700; }
    .primary-action:hover { background: #a9572c; }
    .secondary-action { margin-top: 9px; color: var(--ink); border-color: var(--rule); background: transparent; }
    .secondary-action:hover, .small-action:hover { border-color: var(--brand); background: var(--brand-soft); }
    .primary-action[disabled], .secondary-action[disabled] { cursor: not-allowed; opacity: .48; }
    .summary-panel { display: grid; gap: 8px; margin-top: 14px; padding: 12px 14px; border-radius: var(--radius-control); color: var(--muted); font-size: 12px; }
    .summary-row { display: flex; justify-content: space-between; gap: 12px; }
    .summary-row strong { color: var(--ink); font-family: var(--mono); font-size: 11px; font-weight: 500; text-align: right; }

    .screen-page { min-height: 100%; display: flex; flex-direction: column; }
    .screen-page.connect-page { justify-content: space-between; }
    .screen-page-header { display: flex; align-items: center; justify-content: space-between; min-height: 42px; margin-bottom: 20px; }
    .screen-page-header h2 { margin: 0; font-size: 25px; letter-spacing: -.045em; }
    .screen-page-header .back-button, .screen-page-header .more-button { width: 36px; height: 36px; padding: 0; border: 0; color: var(--brand); background: transparent; cursor: pointer; font-size: 26px; line-height: 1; }
    .screen-page-header .more-button { color: var(--ink); font-size: 24px; }
    .logo-image { display: block; width: 34px; height: 34px; object-fit: contain; }
    .logo-image.large { width: 112px; height: 112px; margin: 0 auto 22px; }
    .brand-lockup { gap: 8px; }
    .brand-lockup .logo-image { width: 30px; height: 30px; }
    .brand-wordmark { display: grid; gap: 0; text-align: left; }
    .brand-wordmark strong { font-size: 15px; line-height: 1.05; }
    .brand-wordmark span { color: var(--muted); font: 9px/1.1 var(--mono); letter-spacing: .08em; }

    .app-nav { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 16px -3px 0; padding: 8px 6px 2px; border-top: 1px solid var(--rule); }
    .app-nav button { min-height: 42px; padding: 5px 3px; border: 0; border-radius: 10px; color: var(--muted); background: transparent; cursor: pointer; font-size: 10px; }
    .app-nav button span { display: block; margin-bottom: 1px; font-size: 18px; line-height: 1; }
    .app-nav button[aria-current="page"] { color: var(--brand); background: var(--brand-soft); font-weight: 700; }

    .connect-hero { padding: 48px 8px 30px; text-align: center; }
    .connect-hero h2 { margin-bottom: 10px; font-size: 25px; letter-spacing: -.045em; }
    .connect-hero p { margin-bottom: 24px; color: var(--muted); font-size: 13px; }
    .text-action { margin-top: 15px; padding: 8px; border: 0; color: var(--muted); background: transparent; cursor: pointer; font-size: 12px; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
    .trust-note { margin-top: auto; padding: 12px; border: 1px solid var(--rule); border-radius: var(--radius-control); color: var(--muted); background: rgba(255,255,255,.35); font-size: 11px; text-align: center; }

    .record-route { padding: 13px; border: 1px solid var(--rule); border-radius: var(--radius-control); }
    .record-route[data-tone="connected"] { border-color: rgba(57,122,91,.52); background: rgba(220,236,227,.32); }
    .record-route[data-tone="waiting"] { border-color: rgba(184,132,39,.6); background: rgba(243,231,199,.34); }
    .record-route[data-tone="error"] { border-color: rgba(182,83,77,.6); background: rgba(244,220,217,.34); }
    .record-route-head { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 11px; }
    .record-route-main { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
    .route-icon { display: grid; place-items: center; width: 34px; height: 34px; flex: 0 0 auto; border-radius: 50%; color: #fff; background: var(--connected); font-size: 19px; }
    .record-route[data-tone="waiting"] .route-icon { background: var(--waiting); }
    .record-route[data-tone="error"] .route-icon { background: var(--error); }
    .record-route-main strong { display: block; font-size: 16px; }
    .record-route-main span { display: block; margin-top: 1px; color: var(--connected); font-size: 12px; }
    .record-route[data-tone="waiting"] .record-route-main span { color: var(--waiting); }
    .record-route[data-tone="error"] .record-route-main span { color: var(--error); }

    .record-canvas { margin-top: 18px; text-align: center; }
    .record-timer { margin: 18px 0 5px; font: 500 clamp(35px, 8vw, 54px)/1 var(--mono); letter-spacing: -.08em; font-variant-numeric: tabular-nums; }
    .record-state { color: var(--muted); font-size: 13px; }
    .record-state::before { display: inline-block; width: 6px; height: 6px; margin-right: 7px; border-radius: 50%; background: var(--brand); content: ""; vertical-align: 2px; }
    .record-divider { display: flex; align-items: center; gap: 9px; margin: 16px 0 11px; color: var(--muted); font-size: 12px; text-align: left; }
    .record-divider::before, .record-divider::after { height: 1px; flex: 1; background: var(--rule); content: ""; }
    .record-divider::after { max-width: 56px; background: var(--brand); }
    .live-wave { display: flex; align-items: center; justify-content: center; gap: 2px; height: 64px; padding: 0 3px; border: 1px solid var(--rule); background: rgba(255,255,255,.24); }
    .live-wave i { width: 2px; min-height: 2px; border-radius: 4px; background: var(--ink); opacity: .84; }
    .live-wave.is-muted i { height: 2px !important; background: var(--rule); }
    .dbfs-label { display: flex; justify-content: space-between; margin-top: 11px; color: var(--muted); font: 11px var(--mono); }
    .dbfs-meter { display: flex; gap: 2px; height: 8px; margin-top: 6px; }
    .dbfs-meter i { flex: 1; border-radius: 2px; background: var(--rule); }
    .dbfs-meter i.on { background: var(--connected); }
    .dbfs-meter i.warn { background: var(--waiting); }
    .record-actions { margin-top: 18px; }
    .record-settings-button { display: block; width: max-content; margin: 10px auto 0; min-height: 38px; padding: 7px 17px; border: 1px solid var(--brand); border-radius: 10px; color: var(--brand); background: transparent; cursor: pointer; font-size: 12px; }
    .record-summary { display: grid; gap: 9px; margin-top: 16px; padding: 12px; border: 1px solid var(--rule); border-radius: var(--radius-control); color: var(--muted); text-align: left; }
    .record-summary-row { display: flex; align-items: center; gap: 9px; font-size: 11px; }
    .record-summary-row .summary-icon { display: grid; place-items: center; width: 25px; height: 25px; flex: 0 0 auto; border-radius: 50%; color: var(--ink); background: #e7e4dc; font-size: 13px; }

    .session-page-list { display: grid; gap: 11px; }
    .session-day { margin: 8px 0 0; padding-bottom: 7px; border-bottom: 1px solid var(--rule); color: var(--muted); font-size: 12px; }
    .mobile-session { display: grid; grid-template-columns: 34px 1fr auto; gap: 9px; align-items: start; padding: 9px 0 13px; border-bottom: 1px solid rgba(217,213,202,.7); }
    .session-wave-icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: #fff; background: var(--brand); font-size: 15px; }
    .mobile-session h3 { margin: 0 0 2px; font-size: 14px; }
    .mobile-session p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.55; }
    .mobile-session-actions { display: grid; gap: 4px; }
    .mobile-session-actions button { min-width: 43px; padding: 3px; border: 0; color: var(--brand); background: transparent; cursor: pointer; font-size: 10px; }
    .mobile-session-actions button.export { color: var(--connected); }
    .empty-session { display: grid; place-items: center; min-height: 260px; border: 1px solid var(--rule); color: var(--muted); text-align: center; }
    .empty-session strong { display: block; margin-top: 8px; color: var(--ink); font-size: 15px; }
    .empty-session span { display: block; margin-top: 4px; font-size: 11px; }

    .settings-list { overflow: hidden; border: 1px solid var(--rule); border-radius: var(--radius-control); }
    .settings-row { display: grid; grid-template-columns: 30px 1fr auto 16px; gap: 8px; align-items: center; min-height: 58px; padding: 9px 10px; border-bottom: 1px solid var(--rule); }
    .settings-row:last-child { border-bottom: 0; }
    .settings-row .setting-icon { color: var(--brand); font-size: 18px; text-align: center; }
    .settings-row strong { font-size: 13px; font-weight: 600; }
    .settings-row .setting-value { color: var(--muted); font-size: 11px; text-align: right; }
    .settings-row .chevron { color: var(--muted); font-size: 19px; }
    .settings-footer { margin-top: auto; padding: 18px 0 0; color: var(--muted); font-size: 11px; text-align: center; }

    .control-column { display: grid; gap: 16px; }
    .panel { padding: 20px; box-shadow: none; }
    .panel h2 { margin-bottom: 6px; font-size: 18px; letter-spacing: -.025em; }
    .panel-intro { margin-bottom: 16px; color: var(--muted); font-size: 13px; }
    .state-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .state-item { padding: 11px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); }
    .state-item span { display: block; color: var(--muted); font-size: 11px; }
    .state-item strong { display: block; margin-top: 2px; font-size: 14px; }
    .state-item strong.mono { font-family: var(--mono); font-size: 12px; }
    .change-note { margin: 15px 0 0; padding: 10px 12px; border-left: 3px solid var(--brand); color: var(--ink); background: var(--brand-soft); font-size: 13px; }
    .free-actions { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
    .small-action { min-height: 42px; padding: 8px 10px; color: var(--ink); border-color: var(--rule); background: transparent; font-size: 12px; }
    .small-action[data-kind="danger"] { color: var(--error); }
    .small-action[data-kind="success"] { color: var(--connected); }

    .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
    .tab { flex: 0 0 auto; padding: 9px 12px; border: 1px solid var(--rule); border-radius: 999px; color: var(--muted); background: transparent; cursor: pointer; font-size: 12px; }
    .tab[aria-selected="true"] { color: var(--ink); border-color: var(--brand); background: var(--brand-soft); font-weight: 700; }
    .scenario-copy { min-height: 48px; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
    .scenario-steps { display: flex; flex-wrap: wrap; gap: 8px; }
    .scenario-step { border: 1px solid var(--rule); border-radius: 10px; padding: 9px 11px; color: var(--ink); background: var(--surface); cursor: pointer; font-size: 12px; }
    .scenario-step.done { border-color: var(--connected); color: var(--connected); background: var(--connected-soft); }
    .scenario-step.current { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(190,106,54,.12); }
    .session-list { display: grid; gap: 8px; }
    .session-card { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px; border-radius: var(--radius-control); }
    .session-card h3 { margin-bottom: 2px; font-size: 14px; }
    .session-card p { margin-bottom: 0; color: var(--muted); font-size: 12px; }
    .session-card .tag { align-self: start; padding: 3px 7px; border-radius: 6px; color: var(--connected); background: var(--connected-soft); font: 11px var(--mono); }
    .log { max-height: 150px; overflow: auto; display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .log li { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid rgba(217,213,202,.7); color: var(--muted); font-size: 12px; }
    .log time { flex: 0 0 auto; color: var(--brand); font-family: var(--mono); }

    @media (max-width: 840px) {
      .workbench { grid-template-columns: 1fr; }
      .phone-column { max-width: 440px; width: 100%; margin: 0 auto; }
    }
    @media (max-width: 460px) {
      .shell { width: min(100% - 20px, 390px); padding-top: 22px; }
      .panel { padding: 16px; }
      .free-actions { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .phone { min-height: 620px; }
      .app-screen { min-height: 620px; padding-inline: 14px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="prototype-banner">TP RECORDER · 交互原型 · 仅用于审查，不是生产代码</div>
  <main class="shell">
    <section class="intro">
      <p class="eyebrow">Session 3 / State model</p>
      <h1>把“真的录到外部蓝牙麦克风”走一遍</h1>
      <p>这个原型让你验证：没有合格蓝牙输入时不写文件；暂停会安全封存分段；蓝牙断开后进入恢复等待；完成后会话库只展示已完成的录音。</p>
    </section>

    <section class="workbench" aria-label="TP Recorder 原型工作台">
      <div class="phone-column">
        <div class="phone">
          <div class="app-screen" id="appScreen" aria-live="polite"></div>
        </div>
      </div>

      <div class="control-column">
        <section class="panel">
          <h2>当前状态</h2>
          <p class="panel-intro">每个操作都会通过同一个状态机处理；非法操作不会偷偷改变状态。</p>
          <div class="state-grid" id="stateGrid"></div>
          <p class="change-note" id="changeNote"></p>
        </section>

        <section class="panel">
          <h2>自由操作</h2>
          <p class="panel-intro">可以任意顺序点击，专门观察边界情况。</p>
          <div class="free-actions" id="freeActions"></div>
        </section>

        <section class="panel">
          <h2>引导场景</h2>
          <div class="tabs" id="scenarioTabs" role="tablist"></div>
          <p class="scenario-copy" id="scenarioCopy"></p>
          <div class="scenario-steps" id="scenarioSteps"></div>
        </section>

        <section class="panel">
          <h2>已完成会话</h2>
          <div class="session-list" id="sessionList"></div>
        </section>

        <section class="panel">
          <h2>操作日志</h2>
          <ul class="log" id="eventLog"></ul>
        </section>
      </div>
    </section>
  </main>

  <script>
    // PROTOTYPE QUESTION: does the Bluetooth-safe recording state model feel right?
    // This reducer is intentionally DOM-free so the validated transition logic can
    // later be lifted into the Android recording domain module.
    const ACTIONS = {
      CONNECT: "CONNECT",
      START: "START",
      TICK: "TICK",
      PAUSE: "PAUSE",
      RESUME: "RESUME",
      DISCONNECT: "DISCONNECT",
      RESCAN: "RESCAN",
      STOP: "STOP",
      PLAY: "PLAY",
      EXPORT: "EXPORT",
      FAIL: "FAIL",
      RESET: "RESET"
    };

    const initialState = () => ({
      route: "waiting",
      recording: "idle",
      elapsedMs: 0,
      segments: [],
      currentSegment: null,
      playingSegment: null,
      exportedSession: false,
      lastError: "",
      lastChange: "等待外部蓝牙输入。不会写入手机麦克风。",
      log: [{ time: "00:00", text: "原型已准备：外部蓝牙输入尚未确认。" }]
    });

    const routeLabels = {
      waiting: ["等待连接", "尚未发现合格的外部蓝牙输入"],
      connected: ["已确认可录音", "DJI Mic Mini · 蓝牙 SCO"],
      lost: ["蓝牙输入已断开", "当前没有写入手机麦克风"]
    };

    const recordingLabels = {
      idle: "已准备好",
      preflight: "正在确认输入",
      recording: "正在录音",
      paused: "已暂停 · 当前分段已保存",
      recovering: "等待蓝牙重新连接",
      completed: "已完成并保存",
      failed: "录音失败"
    };

    function nowLabel() {
      return new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
    }

    function formatDuration(ms) {
      const seconds = Math.floor(ms / 1000);
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      return h ? [h, m, s].map((n) => String(n).padStart(2, "0")).join(":") : [m, s].map((n) => String(n).padStart(2, "0")).join(":");
    }

    function appendLog(state, text) {
      return { ...state, lastChange: text, log: [{ time: nowLabel(), text }, ...state.log].slice(0, 14) };
    }

    function closeCurrentSegment(state, reason) {
      if (!state.currentSegment || state.currentSegment.durationMs <= 0) return { ...state, currentSegment: null };
      const segment = { ...state.currentSegment, status: "READY", endedBy: reason };
      return { ...state, currentSegment: null, segments: [...state.segments, segment] };
    }

    function reduce(state, action) {
      const current = state.currentSegment;
      switch (action.type) {
        case ACTIONS.RESET:
          return initialState();
        case ACTIONS.CONNECT:
          if (state.route === "connected") return appendLog(state, "外部蓝牙输入已经确认，无需重复连接。");
          return appendLog({ ...state, route: "connected", lastError: "" }, "DJI Mic Mini 已被确认是可录音的外部蓝牙输入。");
        case ACTIONS.START:
          if (state.recording === "recording" || state.recording === "preflight") return appendLog(state, "当前已经在录音，重复开始被忽略。");
          if (state.route !== "connected") return appendLog({ ...state, recording: "idle" }, "开始被拒绝：没有合格的外部蓝牙输入，未创建文件。");
          return appendLog({ ...state, recording: "recording", currentSegment: { id: state.segments.length + 1, durationMs: 0, status: "WRITING" }, lastError: "" }, "已通过 routedDevice 安全门，开始写入第 " + (state.segments.length + 1) + " 个分段。");
        case ACTIONS.TICK:
          if (state.recording !== "recording") return appendLog(state, "当前没有进行中的采集，时间没有增加。");
          return appendLog({ ...state, elapsedMs: state.elapsedMs + 10000, currentSegment: { ...current, durationMs: current.durationMs + 10000 } }, "模拟采集 10 秒：录音时长增加，路由仍然有效。");
        case ACTIONS.PAUSE: {
          if (state.recording !== "recording") return appendLog(state, "暂停不可用：当前不是录音中。");
          const closed = closeCurrentSegment(state, "PAUSED");
          return appendLog({ ...closed, recording: "paused" }, "已暂停并封存当前分段；暂停空白不计入录音时长。");
        }
        case ACTIONS.RESUME:
          if (state.recording !== "paused") return appendLog(state, "继续不可用：当前没有已暂停的录音。");
          return appendLog({ ...state, recording: "recording", currentSegment: { id: state.segments.length + 1, durationMs: 0, status: "WRITING" } }, "已继续录音，并创建新的分段。");
        case ACTIONS.DISCONNECT: {
          if (state.route !== "connected") return appendLog(state, "当前已经没有可用的外部蓝牙输入。");
          const shouldRecover = state.recording === "recording" || state.recording === "paused";
          const closed = state.recording === "recording" ? closeCurrentSegment(state, "ROUTE_LOST") : state;
          return appendLog({ ...closed, route: "lost", recording: shouldRecover ? "recovering" : "idle" }, "蓝牙输入丢失：停止写入，未回退到手机麦克风。");
        }
        case ACTIONS.RESCAN:
          if (state.route === "connected") return appendLog(state, "扫描完成：DJI Mic Mini 仍然是合格的外部蓝牙输入。");
          return appendLog({ ...state, route: "connected", recording: state.recording === "recovering" ? "recording" : state.recording, currentSegment: state.recording === "recovering" ? { id: state.segments.length + 1, durationMs: 0, status: "WRITING" } : state.currentSegment }, state.recording === "recovering" ? "重新连接成功，已创建新分段继续录音。" : "重新扫描成功：外部蓝牙输入已确认。");
        case ACTIONS.STOP: {
          if (!["recording", "paused", "recovering"].includes(state.recording)) return appendLog(state, "停止不可用：当前没有进行中的录音会话。");
          const closed = state.recording === "recording" ? closeCurrentSegment(state, "STOPPED") : state;
          return appendLog({ ...closed, recording: closed.segments.length ? "completed" : "failed", lastError: closed.segments.length ? "" : "没有可保存的完整分段" }, closed.segments.length ? "已完成会话：所有分段已封存，可在会话库播放或导出。" : "停止失败：没有可保存的完整分段。");
        }
        case ACTIONS.PLAY:
          if (!state.segments.length) return appendLog(state, "播放不可用：当前没有已完成分段。");
          return appendLog({ ...state, playingSegment: state.playingSegment ? null : state.segments[0].id }, state.playingSegment ? "已停止播放。" : "正在播放第 1 个已完成分段。");
        case ACTIONS.EXPORT:
          if (!state.segments.length) return appendLog(state, "导出不可用：当前没有已完成分段。");
          return appendLog({ ...state, exportedSession: true }, "已打开系统导出流程：只允许导出 READY 分段。");
        case ACTIONS.FAIL:
          return appendLog({ ...state, recording: "failed", lastError: "编码器或存储发生错误", currentSegment: null }, "录音失败：当前写入已停止，未把残片标记为可用录音。");
        default:
          return state;
      }
    }

    const scenarios = {
      happy: {
        label: "正常录音",
        copy: "验证从连接到完成保存的主流程，以及暂停后分段是否安全封存。",
        steps: [["CONNECT", "确认 DJI Mic Mini"], ["START", "开始录音"], ["TICK", "采集 10 秒"], ["PAUSE", "暂停并封存"], ["RESUME", "继续并新建分段"], ["TICK", "再采集 10 秒"], ["STOP", "完成并保存"], ["PLAY", "播放已完成分段"], ["EXPORT", "导出会话"]]
      },
      recovery: {
        label: "蓝牙断连恢复",
        copy: "验证断连后不会录手机麦克风；重连成功后创建新分段继续。",
        steps: [["CONNECT", "确认外部输入"], ["START", "开始录音"], ["TICK", "采集 10 秒"], ["DISCONNECT", "模拟蓝牙断开"], ["TICK", "等待 10 秒（不计时）"], ["RESCAN", "重新扫描并恢复"], ["TICK", "恢复后采集 10 秒"], ["STOP", "保存已有分段"]]
      },
      illegal: {
        label: "拒绝手机麦克风回退",
        copy: "验证在没有外部蓝牙输入时点击开始，不创建文件、不进入录音中。",
        steps: [["RESET", "重置到未连接"], ["START", "尝试开始录音"], ["TICK", "检查时间不增加"], ["CONNECT", "连接外部麦克风"], ["START", "再次开始"], ["STOP", "停止并保存"]]
      },
      failure: {
        label: "编码/存储异常",
        copy: "验证失败不会伪装成完成，也不会把正在写入的残片展示成可用录音。",
        steps: [["CONNECT", "确认外部输入"], ["START", "开始录音"], ["TICK", "采集 10 秒"], ["FAIL", "模拟写入失败"], ["PLAY", "尝试播放失败会话"], ["RESET", "返回初始状态"]]
      }
    };

    let state = initialState();
    let activePage = "record";
    let selectedScenario = "happy";
    let scenarioProgress = 0;

    function dispatch(type) {
      state = reduce(state, { type });
      render();
    }

    function resetScenario(key) {
      selectedScenario = key;
      scenarioProgress = 0;
      state = initialState();
      render();
    }

    function routeTone() {
      if (state.recording === "failed") return "error";
      if (state.route === "waiting" || state.recording === "recovering") return "waiting";
      return "connected";
    }

    const logoSrc = "../docs/assets/generated/logo-signal-tp.png";

    function renderWaveform() {
      const active = state.recording === "recording";
      return `<div class="live-wave ${active ? "" : "is-muted"}" aria-label="实时波形">${Array.from({ length: 54 }, (_, i) => `<i style="height:${active ? 5 + ((i * 17) % 42) : 2}px"></i>`).join("")}</div>`;
    }

    function renderMeter() {
      const live = state.recording === "recording";
      return `<div class="dbfs-meter" aria-label="dBFS 电平">${Array.from({ length: 34 }, (_, i) => `<i class="${live && i < 22 ? "on" : ""} ${live && i > 28 ? "warn" : ""}"></i>`).join("")}</div>`;
    }

    function renderAppNav() {
      return `<nav class="app-nav" aria-label="主导航">
        <button data-page="sessions" aria-current="${activePage === "sessions" ? "page" : "false"}"><span>▤</span>会话库</button>
        <button data-page="record" aria-current="${activePage === "record" ? "page" : "false"}"><span>●</span>录音</button>
        <button data-page="settings" aria-current="${activePage === "settings" ? "page" : "false"}"><span>⚙</span>设置</button>
      </nav>`;
    }

    function renderBrandBar() {
      return `<div class="appbar"><div class="brand-lockup"><img class="logo-image" src="${logoSrc}" alt="TP Signal Logo"><span class="brand-wordmark"><strong>TP Recorder</strong><span>EXTERNAL INPUT RECORDER</span></span></div><button class="appbar-menu" data-page="connect" aria-label="连接引导">⋮</button></div>`;
    }

    function renderConnectPage() {
      return `<div class="screen-page connect-page">
        <div class="appbar"><span class="brand-wordmark"><strong>TP Recorder</strong><span>EXTERNAL INPUT RECORDER</span></span><button class="appbar-menu" data-page="record" aria-label="返回录音">⋮</button></div>
        <div class="connect-hero"><img class="logo-image large" src="${logoSrc}" alt="Signal TP Logo"><h2>连接你的外部麦克风</h2><p>在系统蓝牙设置中连接 DJI Mic Mini 发射器</p><button class="primary-action" data-action="CONNECT" data-page="record">打开蓝牙设置</button><button class="text-action" data-action="CONNECT" data-page="record">我已连接，重新扫描</button></div>
        <div class="trust-note">只有系统确认的蓝牙 SCO / BLE Headset 输入才会开始录音。不会回退到手机麦克风。</div>
      </div>`;
    }

    function renderRecordPage() {
      const [routeTitle, routeSub] = routeLabels[state.route];
      const tone = routeTone();
      const isBusy = ["recording", "paused", "recovering"].includes(state.recording);
      const canStart = state.route === "connected" && !isBusy;
      const primaryLabel = state.recording === "recording" ? "结束并保存" : state.recording === "paused" ? "继续录音" : state.recording === "recovering" ? "停止并保存已有分段" : state.recording === "failed" ? "重新尝试" : "开始录音";
      const primaryAction = state.recording === "recording" ? "STOP" : state.recording === "paused" ? "RESUME" : state.recording === "recovering" ? "STOP" : state.recording === "failed" ? "RESET" : "START";
      const routeName = state.route === "connected" ? "DJI Mic Mini" : routeTitle;
      const routeStatus = state.route === "connected" ? "蓝牙 SCO · 已确认可录音" : routeSub;
      return `<div class="screen-page">
        ${renderBrandBar()}
        <button class="record-route" data-tone="${tone}" data-page="${state.route === "connected" ? "record" : "connect"}" aria-label="打开连接引导"><span class="record-route-head"><span>外部输入</span><span>Bluetooth</span></span><span class="record-route-main"><span class="route-icon">${state.route === "connected" ? "✓" : state.route === "lost" ? "×" : "•"}</span><span><strong>${routeName}</strong><span>${routeStatus}</span></span></span></button>
        <div class="record-canvas"><div class="record-timer">${formatDuration(state.elapsedMs)}</div><div class="record-state">${recordingLabels[state.recording]}</div><div class="record-divider">实时电平</div>${renderWaveform()}<div class="dbfs-label"><span>dBFS</span><span>${state.recording === "recording" ? "-18" : "--"}</span></div>${renderMeter()}</div>
        <div class="record-actions"><button class="primary-action" data-action="${primaryAction}" ${state.recording === "idle" && !canStart ? "disabled" : ""}>${primaryLabel}</button>${state.recording === "recording" ? `<button class="secondary-action" data-action="PAUSE">暂停</button>` : state.recording === "recovering" ? `<button class="secondary-action" data-action="RESCAN">重新扫描</button>` : state.recording === "failed" ? `<button class="secondary-action" data-action="CONNECT">重新确认输入</button>` : `<button class="record-settings-button" data-page="settings">⚙ 设置</button>`}</div>
        <div class="record-summary"><div class="record-summary-row"><span class="summary-icon">♪</span><span>MP3 · 16 kHz · 30 分钟自动分段</span></div><div class="record-summary-row"><span class="summary-icon">▣</span><span>存储位置：内部存储 / TP_Recorder</span></div><div class="record-summary-row"><span class="summary-icon">◷</span><span>可用空间：42.6 GB</span></div></div>
        ${renderAppNav()}
      </div>`;
    }

    function renderSessionsPage() {
      const sessions = state.segments.length ? `<div class="session-day">今天 · 1 个会话</div><div class="mobile-session"><span class="session-wave-icon">〽</span><span><h3>当前录音会话</h3><p>${nowLabel()} · ${formatDuration(state.elapsedMs)} · ${state.segments.length} 个分段 · MP3</p><p>DJI Mic Mini · 16 kHz</p></span><span class="mobile-session-actions"><button data-action="PLAY">▷ 播放</button><button class="export" data-action="EXPORT">⇧ 导出</button></span></div>${state.segments.map((segment) => `<div class="mobile-session"><span class="session-wave-icon" style="background:var(--connected)">〽</span><span><h3>第 ${segment.id} 分段</h3><p>${formatDuration(segment.durationMs)} · ${segment.endedBy}</p><p>READY · MP3</p></span><span class="mobile-session-actions"><button data-action="PLAY">▷ 播放</button></span></div>`).join("")}` : `<div class="empty-session"><div><div style="font-size:38px">⌁</div><strong>会话库为空</strong><span>连接 DJI Mic Mini 后，第一段录音会出现在这里。</span></div></div>`;
      return `<div class="screen-page"><div class="screen-page-header"><h2>会话库</h2><button class="more-button" data-page="connect" aria-label="连接引导">⋮</button></div><div class="session-page-list">${sessions}</div>${renderAppNav()}</div>`;
    }

    function renderSettingsPage() {
      const rows = [["♩", "输入设备", "DJI Mic Mini"], ["▤", "录音格式", "MP3"], ["〽", "音频质量", "16 kHz · 128 kbps"], ["◷", "自动分段", "30 分钟"], ["□", "存储", "设备存储"], ["♧", "后台录音", "前台服务已开启"], ["ⓘ", "关于", ""]];
      return `<div class="screen-page"><div class="screen-page-header"><button class="back-button" data-page="record" aria-label="返回录音">←</button><h2>设置</h2><span style="width:36px"></span></div><div class="settings-list">${rows.map(([icon, label, value]) => `<button class="settings-row" data-page="${label === "输入设备" ? "connect" : "settings"}"><span class="setting-icon">${icon}</span><strong>${label}</strong><span class="setting-value">${value}</span><span class="chevron">›</span></button>`).join("")}</div><div class="settings-footer">仅外部蓝牙输入 · 本地存储 · MP3 优先<br><button class="text-action" data-page="record">完成</button></div>${renderAppNav()}</div>`;
    }

    function renderPhone() {
      if (activePage === "connect") return renderConnectPage();
      if (activePage === "sessions") return renderSessionsPage();
      if (activePage === "settings") return renderSettingsPage();
      return renderRecordPage();
    }

    function renderStateGrid() {
      const stateItems = [
        ["输入路由", routeLabels[state.route][0], ""],
        ["录音状态", recordingLabels[state.recording], ""],
        ["已录音时长", formatDuration(state.elapsedMs), "mono"],
        ["当前写入", state.currentSegment ? `第 ${state.currentSegment.id} 段 · WRITING` : "无", "mono"],
        ["可用分段", `${state.segments.length} 个 READY`, ""],
        ["导出状态", state.exportedSession ? "已打开导出" : "未导出", ""]
      ];
      document.querySelector("#stateGrid").innerHTML = stateItems.map(([label, value, cls]) => `<div class="state-item"><span>${label}</span><strong class="${cls}">${value}</strong></div>`).join("");
      document.querySelector("#changeNote").textContent = state.lastChange;
    }

    function renderFreeActions() {
      const actions = [["CONNECT", "确认外部输入", "success"], ["START", "开始录音", ""], ["TICK", "模拟 +10 秒", ""], ["PAUSE", "暂停", ""], ["RESUME", "继续", ""], ["DISCONNECT", "模拟断连", "danger"], ["RESCAN", "重新扫描", "success"], ["STOP", "停止并保存", ""], ["PLAY", "播放/停止", ""], ["EXPORT", "导出", ""], ["FAIL", "模拟错误", "danger"], ["RESET", "重置", ""]];
      document.querySelector("#freeActions").innerHTML = actions.map(([type, label, kind]) => `<button class="small-action" data-action="${type}" data-kind="${kind}">${label}</button>`).join("");
    }

    function renderScenarios() {
      const keys = Object.keys(scenarios);
      document.querySelector("#scenarioTabs").innerHTML = keys.map((key) => `<button class="tab" role="tab" aria-selected="${key === selectedScenario}" data-scenario="${key}">${scenarios[key].label}</button>`).join("");
      const scenario = scenarios[selectedScenario];
      document.querySelector("#scenarioCopy").textContent = scenario.copy;
      document.querySelector("#scenarioSteps").innerHTML = scenario.steps.map(([type, label], index) => `<button class="scenario-step ${index < scenarioProgress ? "done" : ""} ${index === scenarioProgress ? "current" : ""}" data-scenario-action="${type}">${index + 1}. ${label}</button>`).join("");
    }

    function renderSessions() {
      const list = document.querySelector("#sessionList");
      if (!state.segments.length) {
        list.innerHTML = `<div class="session-card"><div><h3>会话库为空</h3><p>完成一段安全录音后，READY 分段会出现在这里。</p></div><span class="tag">EMPTY</span></div>`;
        return;
      }
      list.innerHTML = `<div class="session-card"><div><h3>当前原型会话</h3><p>${state.segments.length} 个分段 · ${formatDuration(state.elapsedMs)} · MP3 · DJI Mic Mini</p></div><span class="tag">${state.exportedSession ? "EXPORTED" : "READY"}</span></div>` + state.segments.map((segment) => `<div class="session-card"><div><h3>第 ${segment.id} 分段</h3><p>${formatDuration(segment.durationMs)} · ${segment.endedBy} · 可播放</p></div><span class="tag">READY</span></div>`).join("");
    }

    function renderLog() {
      document.querySelector("#eventLog").innerHTML = state.log.map((entry) => `<li><time>${entry.time}</time><span>${entry.text}</span></li>`).join("");
    }

    function render() {
      document.querySelector("#appScreen").innerHTML = renderPhone();
      renderStateGrid();
      renderFreeActions();
      renderScenarios();
      renderSessions();
      renderLog();
    }

    document.addEventListener("click", (event) => {
      const pageButton = event.target.closest("[data-page]");
      if (pageButton) {
        activePage = pageButton.dataset.page;
      }
      const actionButton = event.target.closest("[data-action]");
      if (actionButton) dispatch(actionButton.dataset.action);
      const scenarioTab = event.target.closest("[data-scenario]");
      if (scenarioTab) resetScenario(scenarioTab.dataset.scenario);
      const scenarioButton = event.target.closest("[data-scenario-action]");
      if (scenarioButton) {
        const scenario = scenarios[selectedScenario];
        const expected = scenario.steps[scenarioProgress]?.[0];
        if (scenarioButton.dataset.scenarioAction === expected) {
          dispatch(expected);
          scenarioProgress = Math.min(scenarioProgress + 1, scenario.steps.length);
          render();
        } else {
          state = appendLog(state, `引导步骤顺序不符：下一步应为 ${expected || "完成"}。`);
          render();
        }
      }
      if (pageButton && !actionButton) render();
      if (pageButton && actionButton) render();
    });

    render();
  </script>
</body>
</html>
